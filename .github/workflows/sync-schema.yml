# Keep /schema/v1/ in step with the schema shipped in bad-ass-mcp's latest
# release, so editors validate against what people actually have installed.
name: Sync BAM schema

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch schema from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/HoldMyBeer-gg/bad-ass-mcp/releases/latest --jq .tag_name)
          base="https://raw.githubusercontent.com/HoldMyBeer-gg/bad-ass-mcp/$tag/src/bad_ass_mcp/bam/schema"
          mkdir -p schema/v1
          for f in script.json config.json; do
            if ! curl -fsSL "$base/$f" -o "schema/v1/$f.new"; then
              echo "$tag has no $f yet; keeping the current copy"
              rm -f "schema/v1/$f.new"
              continue
            fi
            mv "schema/v1/$f.new" "schema/v1/$f"
          done
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Schema from bad-ass-mcp $TAG"
          git push
